<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#FAF9F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Calendar">
  <meta name="format-detection" content="telephone=no">
  <title>Calendar</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><svg class="brand-poop" viewBox="0 0 86 76" aria-hidden="true"><use href="#poop-shape"/></svg><h1>Calendar</h1></div>
    </header>

    <section class="calendar-card" aria-label="월간 달력">
      <div class="month-nav">
        <button class="nav-btn" id="prevBtn" type="button" aria-label="이전 달"><svg viewBox="0 0 42 42"><path d="M26 9 14 21l12 12M15 21h15"/></svg></button>
        <h2 id="monthTitle">2026년 9월</h2>
        <button class="nav-btn" id="nextBtn" type="button" aria-label="다음 달"><svg viewBox="0 0 42 42"><path d="m16 9 12 12-12 12m11-12H12"/></svg></button>
      </div>
      <div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div id="calendar" class="calendar-grid" role="grid"></div>
    </section>

    <p id="streakSummary" class="run-streak" aria-live="polite"><svg viewBox="0 0 32 22" aria-hidden="true"><path d="M3 16c7-10 17-11 26-5M7 18c5-6 13-7 20-4"/></svg><span>오늘 러닝해볼까요</span></p>
    <p id="message" class="message" role="status"></p>
  </main>

  <div id="backdrop" class="backdrop" hidden></div>
  <section id="daySheet" class="sheet" aria-modal="true" role="dialog" aria-labelledby="dayTitle" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="dayTitle"></h2><button class="close-btn" type="button" data-close="daySheet" aria-label="날짜 기록 닫기">닫기</button></div>
    <div class="toggles">
      <button id="poopToggle" class="sticker-toggle" type="button" aria-label="응가" aria-pressed="false"><svg viewBox="0 0 86 76" aria-hidden="true"><use href="#poop-shape"/></svg></button>
      <button id="runToggle" class="sticker-toggle" type="button" aria-label="러닝" aria-pressed="false"><svg viewBox="0 0 110 76" aria-hidden="true"><use href="#shoe-shape"/></svg></button>
    </div>
    <div class="section-title"><h3>먹은 음식</h3><span>오늘의 맛있는 기록</span></div>
    <div id="runDetails" class="run-details" hidden>
      <label for="runLaps">운동장 바퀴<input id="runLaps" class="detail-input" type="number" min="0" step="1" inputmode="numeric" placeholder="몇 바퀴"></label>
      <label for="runMinutes">총 운동 시간 (분)<input id="runMinutes" class="detail-input" type="number" min="0" step="1" inputmode="numeric" placeholder="몇 분"></label>
    </div>
    <label for="foodText" class="food-label">먹은 음식 적기</label>
    <textarea id="foodText" class="food-text" rows="3" placeholder="예) 아침 요거트, 점심 김밥"></textarea>
    <div id="photoGrid" class="photo-grid"></div>
    <input id="photoInput" type="file" accept="image/*" multiple hidden>
    <label for="memo" class="memo-label">한 줄 메모</label>
    <input id="memo" class="memo" type="text" maxlength="100" placeholder="오늘 하루는 어땠나요?">
  </section>

  <div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="사진 크게 보기"><button id="viewerClose" aria-label="사진 닫기">닫기</button><img id="viewerImg" alt="먹은 음식 사진"><button id="deletePhotoBtn" class="delete-photo" type="button">이 사진 지우기</button></div>

  <svg width="0" height="0" class="svg-defs" aria-hidden="true"><defs>
    <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="3.6" xChannelSelector="R" yChannelSelector="G"/></filter>
    <pattern id="brown-pencil" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-13)"><rect width="9" height="9" fill="#8D7664"/><path d="M-2 2h13M-2 6h13" stroke="#F4F1E9" stroke-width=".8" opacity=".22"/><path d="M1 0v9M7 0v9" stroke="#DDB6C5" stroke-width=".45" opacity=".18"/></pattern>
    <pattern id="blue-pencil" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-15)"><rect width="8" height="8" fill="#88ACC9"/><path d="M-2 2h12M-2 5h12" stroke="#F4F1E9" stroke-width=".75" opacity=".28"/></pattern>
    <symbol id="poop-shape" viewBox="0 0 86 76"><g filter="url(#wobble)"><path d="M31 27c-2-7 5-10 11-12-1-4 0-8 4-11 1 7 10 8 12 15 1 3 0 6-2 8 8 1 13 5 12 11 0 3-2 6-5 8 9 2 13 7 11 14-2 9-15 12-31 12-17 0-31-3-32-13-1-7 5-12 14-13-5-3-6-7-4-11 2-5 5-7 10-8Z" fill="url(#brown-pencil)" stroke="#8D7664" stroke-width="1.6" stroke-linejoin="round"/><ellipse cx="35" cy="49" rx="2.1" ry="2.8" fill="#F4F1E9"/><ellipse cx="52" cy="49" rx="2.1" ry="2.8" fill="#F4F1E9"/></g></symbol>
    <symbol id="shoe-shape" viewBox="0 0 110 76"><g filter="url(#wobble)"><path d="M26 39c12 2 22-3 26-17l15 4c1 12 8 19 24 23 8 2 12 8 8 14-3 5-11 6-24 6H30c-14 0-22-5-21-13 0-7 7-12 17-17Z" fill="#B8D2DE" stroke="#88ACC9" stroke-width="1.5"/><path d="M51 25c7 5 11 12 12 21 9 4 20 6 34 5l3 9c-19 5-52 4-86-1l-3-8c11 1 21-3 28-11 5-5 7-10 12-15Z" fill="url(#blue-pencil)"/><path d="M50 37l13 2m-17 5 14 2" stroke="#F4F1E9" stroke-width="3" stroke-linecap="round"/><path d="m91 12 3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1Z" fill="#EEE3A2" stroke="#8D7664" stroke-width="1"/><path d="M5 28h14M2 38h12" stroke="#88ACC9" stroke-width="3" stroke-linecap="round"/></g></symbol>
  </defs></svg>
  <script src="./app.js" defer></script>
</body>
</html>
